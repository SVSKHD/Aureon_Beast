name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check aureon scripts tests main_backtest.py main_observer.py
      - name: Unit tests
        run: pytest -q -m "not mt5 and not postgres"
