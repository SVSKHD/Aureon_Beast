# Alembic configuration (plan §6).
#
# Deliberately minimal. In particular there is NO sqlalchemy.url here: the URL comes from
# AUREON_DATABASE_URL through aureon.storage.postgres.database, which is the one place that
# validates it and the one place that knows how to redact it. A URL in a checked-in ini is
# how a database password ends up in a repository.
[alembic]
script_location = aureon/storage/postgres/migrations
prepend_sys_path = .
# Explicit, or alembic warns and falls back to splitting on spaces, commas AND colons --
# which would break the first time a path contained one.
path_separator = os
# Timestamped, sortable revision filenames; the revision ids themselves are set by hand so
# a migration can be cited by name (0001_initial) in a decision or a preflight message.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
