[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aureon"
version = "0.1.0"
description = "Aureon — market observation, evaluation and human-confirmed execution"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pandas>=2.1",
    # Parquet for the live-candle archive the live-vs-replay comparison reads (§82).
    "pyarrow>=14",
    # Local SQLite application storage. PostgreSQL is an optional next-step backend.
    "sqlalchemy>=2.0",
    "python-dotenv>=1.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
discord = ["discord.py>=2.3"]
mt5 = ["MetaTrader5>=5.0.45"]
# 12 T-10. The chart renderer. An extra rather than a core dependency: the observer, the
# executor and the review service never draw anything, and a plotting stack in the process that
# places orders is weight with no purpose. matplotlib is imported lazily inside the renderer, so
# a deployment without this extra still starts -- it just serves the "chart unavailable" image.
charts = ["matplotlib>=3.8"]
dev = [
    "pytest>=8.0",
    "discord.py>=2.3",  # the Phase 6 tests import the embeds/bot adapters
    "matplotlib>=3.8",  # 12 T-10: the chart renderer and its golden-image tests

    "pytest-asyncio>=0.23",
    "ruff>=0.3",
    "pyarrow>=15.0",
]

[tool.setuptools.packages.find]
include = ["aureon*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "mt5: requires a live MetaTrader5 terminal (Windows only)",
    "boundary: architectural boundary guards that must never be skipped",
    "postgres: requires a local PostgreSQL server (AUREON_DATABASE_URL or AUREON_TEST_ADMIN_URL)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Alembic migrations are GENERATED. Their long lines are one column per line straight out
# of autogenerate, and reflowing them by hand is how a hand-edit slips into a file whose
# whole value is that it matches the models it was generated from.
"aureon/storage/postgres/migrations/versions/*.py" = ["E501"]
